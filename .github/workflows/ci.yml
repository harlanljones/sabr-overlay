name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make lint
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: sabr-overlay
          path: sabr-overlay.xpi
